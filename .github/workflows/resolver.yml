name: resolver
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
permissions:
  actions: write
  issues: write
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve due predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scouts/resolver.py
      - name: Commit and deploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "future-scout-bot"
          git config user.email "future-scout-bot@users.noreply.github.com"
          git add findings/
          if git diff --cached --quiet; then echo "nothing resolved"; exit 0; fi
          git commit -m "resolver: grade due predictions"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push; then
              gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
              echo "Pages deployment dispatched"
              exit 0
            fi
            echo "push retry $i"; sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "push failed"; exit 1
