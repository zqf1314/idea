name: translate
on:
  schedule:
    - cron: "20 * * * *"
    - cron: "50 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  models: read
concurrency:
  group: translate
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Translate any findings missing Chinese
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          CLOUDFLARE_BASE_URL: ${{ vars.CLOUDFLARE_BASE_URL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL }}
          TRANSLATE_CAP: "8"
        run: python tools/run_scout_with_provider.py scouts/translate_fill.py
      - name: Commit translations and rebuild feed
        id: commit_feed
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git config user.name "future-scout-bot"
          git config user.email "future-scout-bot@users.noreply.github.com"
          git add findings/*.json
          git reset -q -- findings/feed.json 2>/dev/null || true
          git checkout -q -- findings/feed.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to translate"; exit 0; fi
          git commit -m "translate: fill missing Chinese"
          ok=0
          for i in $(seq 1 8); do
            if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
            echo "finding push retry $i"; sleep $(( (RANDOM % 5) + 2 ))
          done
          [ "$ok" = 1 ] || { echo "finding push failed"; exit 1; }
          python -c "import sys;sys.path.insert(0,'scouts');import scout_lib as s;s.refresh()"
          git add findings/feed.json
          if git diff --cached --quiet; then echo "feed unchanged"; exit 0; fi
          git commit -m "translate: rebuild feed"
          for i in $(seq 1 8); do
            if git push; then
              echo "feed pushed"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main && git reset -q --hard origin/main
            python -c "import sys;sys.path.insert(0,'scouts');import scout_lib as s;s.refresh()"
            git add findings/feed.json
            git diff --cached --quiet || git commit -m "translate: rebuild feed"
            echo "feed push retry $i"; sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "feed push failed"; exit 1
      - name: Refresh SEO/GEO static content
        id: commit_seo
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git config user.name "future-scout-bot"
          git config user.email "future-scout-bot@users.noreply.github.com"
          python -c "import sys;sys.path.insert(0,'scouts');import scout_lib as s;s.build_seo()"
          git add index.html site/index.html sitemap.xml
          if git diff --cached --quiet; then echo "seo unchanged"; exit 0; fi
          git commit -m "seo: refresh crawlable index (JSON-LD + noscript)"
          for i in $(seq 1 8); do
            if git pull --rebase --autostash origin main && git push; then
              echo "seo pushed"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "seo push retry $i"; sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "seo push failed"; exit 1
      - name: Deploy GitHub Pages after visible changes
        if: steps.commit_feed.outputs.changed == 'true' || steps.commit_seo.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "dispatching Deploy GitHub Pages"
          gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Pages deployment dispatched"
