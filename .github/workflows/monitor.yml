name: monitor
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  issues: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Heartbeat, health, and demand signal
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scouts/monitor.py
      - name: Commit health and deploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "future-scout-bot"
          git config user.email "future-scout-bot@users.noreply.github.com"
          git add findings/feed.json
          if git diff --cached --quiet; then echo "health unchanged"; exit 0; fi
          git commit -m "monitor: heartbeat"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
              echo "Pages deployment dispatched"
              exit 0
            fi
            sleep $(( (RANDOM % 4) + 2 ))
          done
          echo "push failed"; exit 1
