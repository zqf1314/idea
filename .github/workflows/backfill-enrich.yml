name: backfill-enrich
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: write
concurrency:
  group: backfill-enrich
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Re-enrich findings
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          CLOUDFLARE_BASE_URL: ${{ vars.CLOUDFLARE_BASE_URL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL }}
        run: python tools/run_scout_with_provider.py scouts/backfill_enrich.py
      - name: Commit and deploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "future-scout-bot"
          git config user.email "future-scout-bot@users.noreply.github.com"
          git add findings/*.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "backfill: sharp bilingual copy + picks"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push; then
              gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
              echo "Pages deployment dispatched"
              exit 0
            fi
            sleep $(( (RANDOM % 4) + 2 ))
          done
          echo "push failed"; exit 1
